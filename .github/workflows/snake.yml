name: snake
# Draws the contribution snake (red, of course) into the `output` branch.
on:
  schedule:
    - cron: "0 17 * * *" # 00:00 WIB
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#e31837&color_dots=#eeeeee,#f7c2cb,#f0899a,#e3405d,#8a1021
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2d4f&color_dots=#161b22,#4a1a22,#7d1d2c,#b51a33,#ff2d4f
      - uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
